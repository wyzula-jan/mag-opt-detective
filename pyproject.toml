[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mag-opt-detective"
version = "5.0.0.dev0"
description = "Plot and analyse magneto-optical FTIR measurements (OPUS and OPUS-macro text files)."
readme = "README.md"
authors = [{ name = "Jan Wyzula", email = "jan.wyzula@psi.ch" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pyqtgraph>=0.13.7",
    "PySide6-Essentials>=6.8",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.gui-scripts]
mag-opt-detective = "mag_opt_detective.app:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-qt>=4.4",
    "ruff>=0.16",
    "pre-commit>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mag_opt_detective"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]
# en dash is used on purpose in UI labels such as "E min – max"
allowed-confusables = ["–"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
qt_api = "pyside6"
