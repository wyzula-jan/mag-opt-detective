[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mag-opt-detective"
version = "0.4.0"
description = "Plot, pick, fit and export magneto-optical FTIR field sweeps (OPUS and OPUS-macro text files)."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Jan Wyzula", email = "wyzula.jan@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.11",
    "pillow>=12",
    "pyqtgraph>=0.13.7",
    "PySide6-Essentials>=6.8",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/wyzula-jan/mag-opt-detective"
Documentation = "https://github.com/wyzula-jan/mag-opt-detective#readme"
Source = "https://github.com/wyzula-jan/mag-opt-detective"
Issues = "https://github.com/wyzula-jan/mag-opt-detective/issues"
Changelog = "https://github.com/wyzula-jan/mag-opt-detective/blob/main/CHANGELOG.md"

[project.gui-scripts]
mag-opt-detective = "mag_opt_detective.app:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-qt>=4.4",
    "ruff>=0.16",
    "pre-commit>=4",
]
bundle = [
    "pyinstaller>=6.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mag_opt_detective"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]
# typographic characters used on purpose in UI labels ("E min – max", "×10⁵ m/s")
allowed-confusables = ["–", "×"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
qt_api = "pyside6"
# a deprecated call in our code fails the tests (e.g. on the newest Python in CI)
filterwarnings = ["error::DeprecationWarning:mag_opt_detective"]
