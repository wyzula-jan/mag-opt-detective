name: Release

# Releases on merge, as the other projects do with python-semantic-release: on every push to main
# it reads the Conventional Commits since the last vX.Y.Z tag and, when a feat, fix, perf or
# breaking change is among them, writes the new version and changelog section, commits them as
# "chore(release): vX.Y.Z" and pushes the commit and its tag with the deploy key (main is
# protected and the key is on its bypass list). Any other push releases nothing, and neither does
# that release commit when it comes back here.
#
# After a new version it builds the app bundles with the App bundles workflow, uploads the Python
# package to PyPI (trusted publishing: the publisher on PyPI names this file and the environment
# pypi, so renaming either means registering it again) and only then creates the GitHub release
# with the bundles attached: the site's download links use /releases/latest, so a release without
# its files must never be the latest. If a later job fails, re-run the failed jobs of that run;
# the version is already committed and is never made twice.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # the branch that triggered the workflow with its entire history, for python-semantic-
      # release's branch detection and history evaluation; the deploy key makes the push possible
      - name: Setup | Checkout Repository on Release Branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          ssh-key: ${{ secrets.CI_DEPLOY_SSH_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.2.0

      # main may have moved while this workflow waited: never release commits it did not evaluate
      - name: Setup | Force release branch to be at workflow sha
        run: |
          git reset --hard ${{ github.sha }}

      - name: Evaluate | Verify upstream has NOT changed
        shell: bash
        run: |
          set +o pipefail

          UPSTREAM_BRANCH_NAME="$(git status -sb | head -n 1 | cut -d' ' -f2 | grep -E '\.{3}' | cut -d'.' -f4)"
          printf '%s\n' "Upstream branch name: $UPSTREAM_BRANCH_NAME"

          set -o pipefail

          if [ -z "$UPSTREAM_BRANCH_NAME" ]; then
              printf >&2 '%s\n' "::error::Unable to determine upstream branch name!"
              exit 1
          fi

          git fetch "${UPSTREAM_BRANCH_NAME%%/*}"

          if ! UPSTREAM_SHA="$(git rev-parse "$UPSTREAM_BRANCH_NAME")"; then
              printf >&2 '%s\n' "::error::Unable to determine upstream branch sha!"
              exit 1
          fi

          HEAD_SHA="$(git rev-parse HEAD)"

          if [ "$HEAD_SHA" != "$UPSTREAM_SHA" ]; then
              printf >&2 '%s\n' "[HEAD SHA] $HEAD_SHA != $UPSTREAM_SHA [UPSTREAM SHA]"
              printf >&2 '%s\n' "::error::Upstream has changed, aborting release..."
              exit 1
          fi

          printf '%s\n' "Verified upstream branch has not changed, continuing with release..."

      - name: Semantic Version Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_COMMIT_AUTHOR: "wyzula-jan <wyzula.jan@gmail.com>"
        shell: bash
        run: |
          pip install python-semantic-release==9.*
          # the GitHub release comes last, in the publish job, with the bundles attached
          semantic-release -vv version --no-vcs-release
          if [ ! -d dist ]; then
            echo "No release will be made"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          {
            echo "released=true"
            echo "tag=v$version"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Check the Python package
        if: steps.release.outputs.released == 'true'
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        if: steps.release.outputs.released == 'true'
        with:
          name: python-package
          path: dist/
          if-no-files-found: error

  bundles:
    name: Bundles
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/bundles.yml
    with:
      ref: ${{ needs.release.outputs.sha }}

  pypi:
    name: Publish to PyPI
    needs: [release, bundles]
    runs-on: ubuntu-latest
    # trusted publishing: PyPI accepts this workflow in this environment, no token is stored
    environment:
      name: pypi
      url: https://pypi.org/project/mag-opt-detective/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          skip-existing: true

  publish:
    name: Publish release
    needs: [release, bundles, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          path: bundles
          pattern: mag-opt-detective-* # the app bundles, not the Python package
          merge-multiple: true
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          # this version's section of CHANGELOG.md: from its heading to the next one
          awk -v head="## $TAG " 'index($0, head) == 1 { found = 1; next } /^## / && found { exit } found' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $TAG"; exit 1; }
          # GitHub allows one release per tag: a second create fails instead of duplicating
          gh release create "$TAG" bundles/* --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes-file notes.md --verify-tag --latest
