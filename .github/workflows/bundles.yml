name: App bundles

# Standalone apps for computers without Python. Built on demand and whenever a change touches
# the packaging, so that spec changes are tested before a release. The Release workflow calls
# this one for every new version and publishes the bundles with the GitHub release it creates;
# this workflow never publishes anything itself.
on:
  push:
    branches: [main]
    paths:
      - "packaging/**"
      - "pyproject.toml"
      - "uv.lock"
      - "src/mag_opt_detective/smoke.py"
      - ".github/workflows/bundles.yml"
  pull_request:
    paths:
      - "packaging/**"
      - "pyproject.toml"
      - "uv.lock"
      - "src/mag_opt_detective/smoke.py"
      - ".github/workflows/bundles.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The commit to build (the release commit)
        type: string
        required: true

permissions:
  contents: read

# a newer push cancels an older build; a release build (called with a ref) is never cancelled
concurrency:
  group: bundles-${{ inputs.ref && 'release' || github.ref }}
  cancel-in-progress: ${{ !inputs.ref }}

jobs:
  bundle:
    name: Bundle (${{ matrix.os }})
    # a pushed release commit is built by the Release workflow, which calls this one
    if: inputs.ref || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # pinned: the README states the glibc this bundle needs (2.39, Ubuntu 24.04)
          - os: ubuntu-24.04
            archive: mag-opt-detective-linux.tar.gz
          # Apple silicon (arm64) only
          - os: macos-latest
            archive: mag-opt-detective-macos.zip
          - os: windows-latest
            archive: mag-opt-detective-windows.zip
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }} # empty unless called: the pushed or chosen commit
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libglib2.0-0 libdbus-1-3
      # the app and PyInstaller only: development tools (pytest, ruff, pyyaml, ...) would be
      # picked up by PyInstaller through optional imports
      - run: uv sync --locked --no-default-groups --group bundle
      - run: uv run --no-sync pyinstaller packaging/mag-opt-detective.spec --noconfirm

      - name: Smoke test and archive (Linux)
        if: runner.os == 'Linux'
        run: |
          dist/mag-opt-detective/mag-opt-detective --smoke-test
          tar -czf "${{ matrix.archive }}" -C dist mag-opt-detective
      - name: Smoke test and archive (macOS)
        if: runner.os == 'macOS'
        run: |
          "dist/Magneto-Optical Detective.app/Contents/MacOS/mag-opt-detective" --smoke-test
          ditto -c -k --keepParent "dist/Magneto-Optical Detective.app" "${{ matrix.archive }}"
      - name: Smoke test and archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # a windowed exe returns immediately unless we wait for it
          $p = Start-Process -FilePath dist\mag-opt-detective\mag-opt-detective.exe `
            -ArgumentList '--smoke-test' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }
          Compress-Archive -Path dist\mag-opt-detective -DestinationPath "${{ matrix.archive }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
