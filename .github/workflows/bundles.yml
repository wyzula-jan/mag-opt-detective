name: App bundles

# Standalone apps for computers without Python. Built for every version tag (v5.0.0) and on
# demand; a tag also publishes them as a GitHub release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

jobs:
  bundle:
    name: Bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: mag-opt-detective-linux.tar.gz
          - os: macos-latest
            archive: mag-opt-detective-macos.zip
          - os: windows-latest
            archive: mag-opt-detective-windows.zip
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libglib2.0-0 libdbus-1-3
      # the app and PyInstaller only: development tools (pytest, ruff, pyyaml, ...) would be
      # picked up by PyInstaller through optional imports
      - run: uv sync --locked --no-default-groups --group bundle
      - run: uv run --no-sync pyinstaller packaging/mag-opt-detective.spec --noconfirm

      - name: Smoke test and archive (Linux)
        if: runner.os == 'Linux'
        run: |
          dist/mag-opt-detective/mag-opt-detective --smoke-test
          tar -czf "${{ matrix.archive }}" -C dist mag-opt-detective
      - name: Smoke test and archive (macOS)
        if: runner.os == 'macOS'
        run: |
          "dist/Magneto-Optical Detective.app/Contents/MacOS/mag-opt-detective" --smoke-test
          ditto -c -k --keepParent "dist/Magneto-Optical Detective.app" "${{ matrix.archive }}"
      - name: Smoke test and archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # a windowed exe returns immediately unless we wait for it
          $p = Start-Process -FilePath dist\mag-opt-detective\mag-opt-detective.exe `
            -ArgumentList '--smoke-test' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }
          Compress-Archive -Path dist\mag-opt-detective -DestinationPath "${{ matrix.archive }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: bundles
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" bundles/* \
            --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
