<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Full-bleed artwork; make_icons.py applies the macOS rounded square.
       Landau fan E = a * sqrt(B) from the origin (262, 770), 520 wide, 500 high:
       each curve is the parabola Q (262, 770 - 250a) -> (782, 770 - 500a). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a2f86"/>
      <stop offset="1" stop-color="#4a1272"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <path d="M 262 230 L 262 770 L 822 770" fill="none" stroke="#ffffff" stroke-opacity="0.35"
        stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="round">
    <path d="M 262 770 Q 262 685 782 600" stroke-opacity="0.45"/>
    <path d="M 262 770 Q 262 630 782 490" stroke-opacity="0.62"/>
    <path d="M 262 770 Q 262 575 782 380" stroke-opacity="0.8"/>
    <path d="M 262 770 Q 262 520 782 270"/>
  </g>
</svg>
